steps:
  # Paso 1: Construir la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/laslocaswhatsapp:$COMMIT_SHA', '.']

  # Paso 2: Subir la imagen al registro
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    args: ['push', 'gcr.io/$PROJECT_ID/laslocaswhatsapp:$COMMIT_SHA']

  # Paso 3: Migraciones Alembic antes del deploy (el contenedor también migra al arrancar)
  - name: 'gcr.io/$PROJECT_ID/laslocaswhatsapp:$COMMIT_SHA'
    id: migrate
    waitFor: ['push']
    dir: /DANIEBOT
    entrypoint: python
    args: ['-c', 'from database.run_migrations import apply_migrations_and_seed; apply_migrations_and_seed()']
    secretEnv:
      - DB_USER
      - DB_PASSWORD
      - DB_NAME
      - DB_HOST
      - DB_PORT

  # Paso 4: Desplegar en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'deploy-whatsapp-cloudbuild'
      - '--image'
      - 'gcr.io/$PROJECT_ID/laslocaswhatsapp:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--no-allow-unauthenticated'
      - '--vpc-connector'
      - 'whatsapp-bot-vpc-connecto'
      - '--set-secrets'
      - 'PYWA_VERIFY_TOKEN=PYWA_VERIFY_TOKEN:latest,PYWA_AUTH_TOKEN=PYWA_AUTH_TOKEN:latest,PYWA_PHONE_ID=PYWA_PHONE_ID:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,DB_NAME=DB_NAME:latest,DB_HOST=DB_HOST:latest,DB_PORT=DB_PORT:latest,LOGIN_EMAIL=LOGIN_EMAIL:latest,LOGIN_PASS=LOGIN_PASS:latest'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DB_USER/versions/latest
      env: DB_USER
    - versionName: projects/$PROJECT_ID/secrets/DB_PASSWORD/versions/latest
      env: DB_PASSWORD
    - versionName: projects/$PROJECT_ID/secrets/DB_NAME/versions/latest
      env: DB_NAME
    - versionName: projects/$PROJECT_ID/secrets/DB_HOST/versions/latest
      env: DB_HOST
    - versionName: projects/$PROJECT_ID/secrets/DB_PORT/versions/latest
      env: DB_PORT

options:
  logging: CLOUD_LOGGING_ONLY
  # Mismo acceso privado a Cloud SQL que Cloud Run (conector VPC)
  vpcAccess:
    connector: projects/$PROJECT_ID/locations/us-central1/connectors/whatsapp-bot-vpc-connecto
    egress: PRIVATE_RANGES_ONLY

images:
  - 'gcr.io/$PROJECT_ID/laslocaswhatsapp:$COMMIT_SHA'
