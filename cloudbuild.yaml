steps:
  # Paso 1: Construir la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/laslocaswhatsapp:$COMMIT_SHA', '.']

  # Paso 2: Subir la imagen al registro
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    args: ['push', 'gcr.io/$PROJECT_ID/laslocaswhatsapp:$COMMIT_SHA']

  # Paso 3: Desplegar en Cloud Run
  # Base de datos: Neon vía secreto DATABASE_URL (sin VPC connector ni Cloud SQL).
  # Costos: sin cpu-boost, max 5 instancias, escala a cero (min 0 implícito).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    waitFor: ['push']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'deploy-whatsapp-cloudbuild'
      - '--image'
      - 'gcr.io/$PROJECT_ID/laslocaswhatsapp:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--no-allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '5'
      - '--concurrency'
      - '80'
      - '--clear-vpc-connector'
      - '--no-cpu-boost'
      - '--remove-env-vars'
      - 'CLOUD_SQL_CONNECTION_NAME,DB_USER,DB_PASSWORD,DB_NAME,DB_HOST,DB_PORT'
      - '--set-secrets'
      - 'PYWA_VERIFY_TOKEN=PYWA_VERIFY_TOKEN:latest,PYWA_AUTH_TOKEN=PYWA_AUTH_TOKEN:latest,PYWA_PHONE_ID=PYWA_PHONE_ID:latest,DATABASE_URL=DATABASE_URL:latest,LOGIN_EMAIL=LOGIN_EMAIL:latest,LOGIN_PASS=LOGIN_PASS:latest'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/laslocaswhatsapp:$COMMIT_SHA'
