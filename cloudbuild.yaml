steps:
  # Paso 1: Construir la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/laslocaswhatsapp:$COMMIT_SHA', '.']

  # Paso 2: Subir la imagen al registro
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    args: ['push', 'gcr.io/$PROJECT_ID/laslocaswhatsapp:$COMMIT_SHA']

  # Paso 3: Desplegar en Cloud Run
  # Base de datos: Neon vía secreto DATABASE_URL (sin VPC connector ni Cloud SQL).
  # Migraciones Alembic: al arrancar el contenedor (scripts/docker_entrypoint.py).
  # Tienda pública + webhook Meta: allow-unauthenticated (auth admin vía JWT en /login).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    waitFor: ['push']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'deploy-whatsapp-cloudbuild'
      - '--image'
      - 'gcr.io/$PROJECT_ID/laslocaswhatsapp:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '5'
      - '--concurrency'
      - '80'
      - '--clear-vpc-connector'
      - '--no-cpu-boost'
      # gcloud permite solo un flag de env vars por deploy (--update-env-vars no borra APP_ID/APP_SECRET existentes)
      - '--update-env-vars'
      - 'APP_DEBUG=false,ADMIN_LOGIN_NAV_VISIBLE=false,STORAGE_BACKEND=gcs,GCS_BUCKET_NAME=bucket_laslocas_prod,SITE_PUBLIC_URL=https://outfitjazmines.com.ar,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,ADMIN_NOTIFY_EMAIL_ENABLED=false'
      - '--set-secrets'
      - 'PYWA_VERIFY_TOKEN=PYWA_VERIFY_TOKEN:latest,PYWA_AUTH_TOKEN=PYWA_AUTH_TOKEN:latest,PYWA_PHONE_ID=PYWA_PHONE_ID:latest,DATABASE_URL=DATABASE_URL:latest,LOGIN_EMAIL=LOGIN_EMAIL:latest,LOGIN_PASS=LOGIN_PASS:latest,ADMIN_USERNAME=ADMIN_USERNAME:latest,ADMIN_PASSWORD_HASH=ADMIN_PASSWORD_HASH:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/laslocaswhatsapp:$COMMIT_SHA'
