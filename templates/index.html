<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>{{ page_title_catalog }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fafafa] min-h-screen flex flex-col antialiased">

  {% include "partials/header.html" %}

  <div class="sticky top-[52px] sm:top-[56px] z-30 bg-black text-white text-center text-xs sm:text-sm leading-snug py-2 sm:py-2.5 px-3 sm:px-4 font-medium tracking-wide border-t border-white/10 shadow-sm">
    {{ promo_banner_text }}
  </div>

<section class="relative bg-gradient-to-b from-neutral-100 via-white to-[#fafafa] py-6 sm:py-8 md:py-10 border-b border-neutral-200/80 overflow-hidden">
  <div class="absolute inset-0 opacity-[0.35] pointer-events-none bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-200/60 via-transparent to-transparent"></div>
  <div class="relative max-w-7xl mx-auto px-3 sm:px-4 text-center">
    <p class="text-[10px] sm:text-xs uppercase tracking-[0.2em] text-gray-500 mb-1 sm:mb-2">{{ brand_name }}</p>
    <h1 class="text-xl sm:text-3xl md:text-4xl font-bold text-gray-900">{{ hero_headline }}</h1>
    <p class="mt-2 sm:mt-3 text-xs sm:text-base text-gray-600 max-w-xl mx-auto leading-relaxed">{{ hero_subtitle }}</p>
  </div>
</section>

<!-- Banners destacados -->
<section id="home-banners-section" class="hidden bg-white border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3 sm:py-5">
    <div id="home-banners" class="w-full"></div>
  </div>
</section>

<section id="catalog-filters" class="bg-white border-b border-gray-100" aria-label="Filtros del catálogo">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3 space-y-3">
    <div id="catalog-cats-row" class="flex items-center gap-2 overflow-x-auto whitespace-nowrap pb-1 [-webkit-overflow-scrolling:touch]"></div>
    <p id="catalog-sizes-hint" class="text-xs text-gray-500">Elegí una categoría para filtrar por talle.</p>
    <div id="catalog-sizes-section" class="hidden">
      <p class="text-[10px] sm:text-xs uppercase tracking-wider text-gray-400 mb-2">Talle</p>
      <div id="catalog-sizes-row" class="flex items-center gap-2 overflow-x-auto whitespace-nowrap pb-1 [-webkit-overflow-scrolling:touch]"></div>
    </div>
  </div>
</section>

<main class="flex-1 max-w-7xl mx-auto px-3 sm:px-4 py-6 sm:py-8 w-full">

  <div id="active-filters" class="hidden mb-4 flex flex-wrap items-center gap-2 text-xs sm:text-sm text-gray-700"></div>

  <p id="catalog-loading" class="text-center text-gray-500 py-12 text-sm sm:text-base">Cargando catálogo…</p>
  <div class="hidden grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-5" id="contenedor-productos"></div>
  <p id="catalog-empty" class="hidden text-center text-gray-500 py-16 text-sm sm:text-base px-2">No hay productos por el momento.</p>

  <nav id="pagination" class="mt-10 sm:mt-12 flex flex-col items-stretch sm:items-center gap-3 hidden w-full max-w-md mx-auto sm:max-w-none" aria-label="Paginación del catálogo">
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 sm:gap-2 w-full">
      <button type="button" id="btn-prev" class="w-full sm:w-auto min-h-[44px] px-4 py-3 rounded-full border border-gray-200 bg-white text-gray-900 text-sm font-semibold hover:bg-gray-50 active:bg-gray-100 disabled:opacity-40 disabled:pointer-events-none touch-manipulation shadow-sm">
        Anterior
      </button>
      <span id="pagination-info" class="text-center text-sm text-gray-600 px-2 py-1 order-first sm:order-none"></span>
      <button type="button" id="btn-next" class="w-full sm:w-auto min-h-[44px] px-4 py-3 rounded-full border border-gray-200 bg-white text-gray-900 text-sm font-semibold hover:bg-gray-50 active:bg-gray-100 disabled:opacity-40 disabled:pointer-events-none touch-manipulation shadow-sm">
        Siguiente
      </button>
    </div>
  </nav>
</main>

{% include "partials/footer.html" %}

  <script>
    const LABEL_CTA = {{ label_catalog_cta | tojson }};
    const BADGE_INM = {{ label_badge_inmediato | tojson }};
    const BADGE_ENC = {{ label_badge_encargo | tojson }};
    const BADGE_SALE = {{ label_badge_sale | tojson }};
    const PLACEHOLDER_NO_IMAGE = {{ placeholder_no_image | tojson }};
    const PER_PAGE = 12;
    const CHIP_ACTIVE = 'inline-flex items-center min-h-[44px] px-3 py-1.5 rounded-full text-xs sm:text-sm font-semibold border bg-black text-white border-black touch-manipulation flex-shrink-0';
    const CHIP_INACTIVE = 'inline-flex items-center min-h-[44px] px-3 py-1.5 rounded-full text-xs sm:text-sm font-semibold border bg-white text-gray-700 border-gray-200 hover:border-gray-400 touch-manipulation flex-shrink-0';

    let categoryNameMap = { todos: 'Todas' };

    const moneyFmt = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
    function formatPrecio(n) { return moneyFmt.format(Number(n) || 0); }

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }

    function badgesHtml(p) {
      const vr = p.variantes_resumen || {};
      const chips = [];
      if (p.is_sale) {
        chips.push('<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-bold bg-red-600 text-white">' + BADGE_SALE + (p.descuento_porcentaje ? ' -' + p.descuento_porcentaje + '%' : '') + '</span>');
      }
      if (vr.badge_inmediato) {
        chips.push('<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-semibold bg-green-100 text-green-900">' + BADGE_INM + '</span>');
      }
      if (vr.badge_encargo) {
        chips.push('<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-semibold bg-amber-100 text-amber-900">' + BADGE_ENC + '</span>');
      }
      return chips.length ? '<div class="flex flex-wrap gap-1.5 mt-2">' + chips.join('') + '</div>' : '';
    }

    function priceBlock(p) {
      const final = formatPrecio(p.precio_final ?? p.precio);
      if (p.is_sale && p.precio_original && p.precio_original > (p.precio_final ?? p.precio)) {
        const orig = formatPrecio(p.precio_original);
        return `
          <div class="mt-3 flex items-baseline gap-2 flex-wrap">
            <span class="text-green-600 text-lg sm:text-xl font-extrabold tabular-nums">$${final}</span>
            <span class="text-gray-400 text-sm line-through tabular-nums">$${orig}</span>
          </div>`;
      }
      return `<p class="text-gray-900 text-lg sm:text-xl font-bold mt-3 tabular-nums">$${final}</p>`;
    }

    function renderProductos(productos) {
      const cont = document.getElementById('contenedor-productos');
      cont.innerHTML = productos.map(p => {
        const imgUrl = p.imagen || ('https://via.placeholder.com/600x400?text=' + encodeURIComponent(PLACEHOLDER_NO_IMAGE));
        const titulo = escHtml(p.titulo);
        const desc = escHtml(p.descripcion || '');
        const cat = p.categoria && p.categoria.name ? escHtml(p.categoria.name) : '';
        return `
  <article class="group bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-lg hover:border-gray-200 transition-all duration-200 overflow-hidden flex flex-col">
    <a href="api/detalle/${p.id}" class="block relative bg-gray-50 aspect-[3/4] flex items-center justify-center overflow-hidden">
      ${p.is_sale ? '<span class="absolute top-2 left-2 z-10 inline-flex items-center px-2 py-1 rounded-md text-[10px] font-bold bg-red-600 text-white shadow">' + BADGE_SALE + (p.descuento_porcentaje ? ' -' + p.descuento_porcentaje + '%' : '') + '</span>' : ''}
      <img src="${imgUrl}" alt="" class="max-w-full max-h-full w-auto h-auto object-contain p-2 transition-transform duration-300 group-hover:scale-[1.02]">
    </a>
    <div class="p-3 sm:p-4 flex-1 flex flex-col">
      ${cat ? `<p class="text-[10px] sm:text-xs uppercase tracking-wider text-gray-400">${cat}</p>` : ''}
      <h3 class="text-sm sm:text-base font-semibold text-gray-900 leading-snug mt-0.5 line-clamp-2">
        <a href="api/detalle/${p.id}" class="hover:text-black">${titulo}</a>
      </h3>
      ${badgesHtml(p)}
      ${priceBlock(p)}
      <p class="hidden sm:block text-gray-500 text-sm mt-2 line-clamp-2 flex-1">${desc}</p>
      <div class="mt-3 sm:mt-4 sm:pt-3 sm:border-t sm:border-gray-100">
        <a href="api/detalle/${p.id}" class="flex w-full min-h-[40px] sm:min-h-[44px] items-center justify-center rounded-full bg-black text-white text-xs sm:text-sm font-semibold hover:bg-gray-900 active:bg-gray-950 transition touch-manipulation shadow-sm">
          ${LABEL_CTA}
        </a>
      </div>
    </div>
  </article>`;
      }).join('');
    }

    function urlState() {
      const u = new URL(window.location.href);
      const sizeRaw = (u.searchParams.get('size_code') || u.searchParams.get('talle') || '').trim().toUpperCase();
      return {
        page: Math.max(1, parseInt(u.searchParams.get('page') || '1', 10) || 1),
        q: (u.searchParams.get('q') || '').trim(),
        cat: (u.searchParams.get('cat') || '').trim().toLowerCase(),
        size_code: sizeRaw,
        sale: (u.searchParams.get('sale') || '') === '1',
      };
    }

    function setUrl(state) {
      const u = new URL(window.location.href);
      if (state.page && state.page > 1) u.searchParams.set('page', String(state.page));
      else u.searchParams.delete('page');
      if (state.q) u.searchParams.set('q', state.q); else u.searchParams.delete('q');
      if (state.cat && state.cat !== 'todos') u.searchParams.set('cat', state.cat); else u.searchParams.delete('cat');
      if (state.size_code) u.searchParams.set('size_code', state.size_code); else u.searchParams.delete('size_code');
      if (state.sale) u.searchParams.set('sale', '1'); else u.searchParams.delete('sale');
      window.history.replaceState({}, '', u.pathname + u.search);
    }

    function buildApiUrl(state) {
      const params = new URLSearchParams();
      params.set('page', String(state.page || 1));
      params.set('per_page', String(PER_PAGE));
      if (state.q) params.set('q', state.q);
      if (state.cat && state.cat !== 'todos') params.set('cat', state.cat);
      if (state.size_code) params.set('size_code', state.size_code);
      if (state.sale) params.set('sale', '1');
      return '/api/productos?' + params.toString();
    }

    function activeFilterCount(state) {
      let n = 0;
      if (state.q) n += 1;
      if (state.cat && state.cat !== 'todos') n += 1;
      if (state.size_code) n += 1;
      if (state.sale) n += 1;
      return n;
    }

    function renderActiveFilters(state) {
      const box = document.getElementById('active-filters');
      const chips = [];
      if (state.q) chips.push(`<span class="inline-flex items-center gap-1 bg-gray-100 text-gray-800 px-2.5 py-1 rounded-full">Buscar: "${escHtml(state.q)}" <a href="${updateLink({q:''})}" class="text-gray-500 hover:text-black">×</a></span>`);
      if (state.cat && state.cat !== 'todos') {
        const catLabel = categoryNameMap[state.cat] || state.cat;
        chips.push(`<span class="inline-flex items-center gap-1 bg-gray-100 text-gray-800 px-2.5 py-1 rounded-full">Categoría: ${escHtml(catLabel)} <a href="${updateLink({cat:''})}" class="text-gray-500 hover:text-black">×</a></span>`);
      }
      if (state.size_code) chips.push(`<span class="inline-flex items-center gap-1 bg-gray-100 text-gray-800 px-2.5 py-1 rounded-full">Talle: ${escHtml(state.size_code)} <a href="${updateLink({size_code:''})}" class="text-gray-500 hover:text-black">×</a></span>`);
      if (state.sale) chips.push(`<span class="inline-flex items-center gap-1 bg-red-100 text-red-800 px-2.5 py-1 rounded-full">Sale <a href="${updateLink({sale:false})}" class="text-red-500 hover:text-red-900">×</a></span>`);
      if (activeFilterCount(state) > 1) {
        chips.push(`<a href="${updateLink({q:'', cat:'', size_code:'', sale:false})}" class="inline-flex items-center min-h-[32px] px-2 text-xs font-semibold text-gray-600 hover:text-black underline touch-manipulation">Limpiar todo</a>`);
      }
      if (!chips.length) { box.classList.add('hidden'); box.innerHTML=''; return; }
      box.classList.remove('hidden');
      box.innerHTML = chips.join('');
    }

    function updateLink(patch) {
      const u = new URL(window.location.href);
      Object.entries(patch).forEach(([k,v]) => {
        if (v === '' || v === false || v == null) u.searchParams.delete(k);
        else u.searchParams.set(k, String(v));
      });
      u.searchParams.delete('page');
      return u.pathname + u.search;
    }

    function renderPaginationState(data) {
      const nav = document.getElementById('pagination');
      const info = document.getElementById('pagination-info');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      if (!data.total_pages || data.total_pages <= 1) { nav.classList.add('hidden'); return; }
      nav.classList.remove('hidden');
      info.textContent = 'Página ' + data.page + ' de ' + data.total_pages;
      btnPrev.disabled = data.page <= 1;
      btnNext.disabled = data.page >= data.total_pages;
    }

    function showCatalogState(loading, hasProducts) {
      document.getElementById('catalog-loading').classList.toggle('hidden', !loading);
      const grid = document.getElementById('contenedor-productos');
      grid.classList.toggle('hidden', loading || !hasProducts);
      document.getElementById('catalog-empty').classList.toggle('hidden', loading || hasProducts);
    }

    let state = urlState();

    async function applyFilterPatch(patch) {
      if ('cat' in patch && patch.cat !== state.cat) {
        state.size_code = '';
      }
      Object.assign(state, patch);
      state.page = 1;
      setUrl(state);
      await syncFilterBars();
      loadProductos();
    }

    async function loadCategories() {
      const row = document.getElementById('catalog-cats-row');
      if (!row) return;
      try {
        const r = await fetch('/api/categories');
        const cats = r.ok ? await r.json() : [];
        categoryNameMap = { todos: 'Todas' };
        cats.forEach(c => { categoryNameMap[c.slug] = c.name; });
        const items = [{ slug: 'todos', name: 'Todas' }].concat(cats);
        row.innerHTML = items.map(c => {
          const active = (c.slug === 'todos' && (!state.cat || state.cat === 'todos')) || c.slug === state.cat;
          const slug = c.slug === 'todos' ? '' : c.slug;
          return `<button type="button" data-cat="${escHtml(slug)}" class="${active ? CHIP_ACTIVE : CHIP_INACTIVE}">${escHtml(c.name)}</button>`;
        }).join('');
        row.querySelectorAll('button[data-cat]').forEach(btn => {
          btn.addEventListener('click', () => {
            const newCat = btn.getAttribute('data-cat') || '';
            const currentCat = state.cat && state.cat !== 'todos' ? state.cat : '';
            if (newCat === currentCat) return;
            applyFilterPatch({ cat: newCat, size_code: '' });
          });
        });
      } catch (e) {
        row.innerHTML = '';
      }
    }

    async function loadSizes(categorySlug) {
      const section = document.getElementById('catalog-sizes-section');
      const hint = document.getElementById('catalog-sizes-hint');
      const row = document.getElementById('catalog-sizes-row');
      if (!section || !hint || !row) return;

      if (!categorySlug || categorySlug === 'todos') {
        section.classList.add('hidden');
        hint.classList.remove('hidden');
        row.innerHTML = '';
        return;
      }

      hint.classList.add('hidden');
      section.classList.remove('hidden');

      try {
        const r = await fetch('/api/sizes?category_slug=' + encodeURIComponent(categorySlug));
        const sizes = r.ok ? await r.json() : [];
        const allActive = !state.size_code;
        let html = `<button type="button" data-size="" class="${allActive ? CHIP_ACTIVE : CHIP_INACTIVE}">Todos los talles</button>`;
        html += sizes.map(s => {
          const code = String(s.code || '').toUpperCase();
          const label = s.label || code;
          const active = state.size_code === code;
          return `<button type="button" data-size="${escHtml(code)}" class="${active ? CHIP_ACTIVE : CHIP_INACTIVE}">${escHtml(label)}</button>`;
        }).join('');
        row.innerHTML = html;
        row.querySelectorAll('button[data-size]').forEach(btn => {
          btn.addEventListener('click', () => {
            const newSize = (btn.getAttribute('data-size') || '').toUpperCase();
            if (newSize === (state.size_code || '')) return;
            applyFilterPatch({ size_code: newSize });
          });
        });
      } catch (e) {
        section.classList.add('hidden');
        hint.classList.remove('hidden');
        row.innerHTML = '';
      }
    }

    async function syncFilterBars() {
      await loadCategories();
      if (state.cat && state.cat !== 'todos') {
        await loadSizes(state.cat);
      } else {
        await loadSizes(null);
      }
    }

    function loadProductos() {
      showCatalogState(true, true);
      renderActiveFilters(state);
      fetch(buildApiUrl(state))
        .then(r => r.json())
        .then(data => {
          if (data.total_pages && state.page > data.total_pages && data.total_pages >= 1) {
            state.page = data.total_pages;
            setUrl(state);
            loadProductos();
            return;
          }
          state.page = data.page || state.page;
          const items = data.items || [];
          renderProductos(items);
          renderPaginationState(data);
          const hasProducts = items.length > 0;
          showCatalogState(false, hasProducts);
          if (!hasProducts) document.getElementById('pagination').classList.add('hidden');
        })
        .catch(e => {
          console.error(e);
          showCatalogState(false, false);
          document.getElementById('catalog-empty').textContent = 'No se pudo cargar el catálogo. Intentá de nuevo más tarde.';
        });
    }

    function bannerMediaType(b) {
      if (b.media_type === 'video' || b.media_type === 'image') return b.media_type;
      const u = (b.image_url || '').split('?')[0].toLowerCase();
      if (/\.(mp4|webm|mov|m4v)$/.test(u)) return 'video';
      return 'image';
    }

    function bannerMediaHtml(b, altText) {
      const url = escHtml(b.image_url);
      if (bannerMediaType(b) === 'video') {
        return `<video src="${url}" class="absolute inset-0 w-full h-full object-cover pointer-events-none" playsinline muted autoplay loop preload="metadata" aria-label="${altText}"></video>`;
      }
      return `<img src="${url}" alt="${altText}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-[1.02] transition-transform duration-300" loading="lazy">`;
    }

    function bannerItemClass(count) {
      const base = 'group relative block overflow-hidden rounded-2xl border border-gray-200 shadow-sm hover:shadow-lg transition-shadow bg-gray-100 min-h-[28dvh] max-h-[40dvh] h-[33dvh]';
      if (count <= 2) return base + ' w-full';
      return base + ' flex-shrink-0 w-[92vw] sm:w-full snap-center';
    }

    function applyBannerContainerLayout(container, count) {
      if (count === 1) {
        container.className = 'grid grid-cols-1 gap-2 w-full';
      } else if (count === 2) {
        container.className = 'grid grid-cols-2 gap-2 w-full';
      } else {
        container.className = 'flex gap-2 overflow-x-auto snap-x snap-mandatory scroll-smooth w-full pb-1 [-webkit-overflow-scrolling:touch]';
      }
    }

    async function loadHomeBanners() {
      const section = document.getElementById('home-banners-section');
      const container = document.getElementById('home-banners');
      if (!section || !container) return;
      try {
        const r = await fetch('/api/home-banners');
        const banners = r.ok ? await r.json() : [];
        if (!banners.length) {
          section.classList.add('hidden');
          return;
        }
        section.classList.remove('hidden');
        const n = banners.length;
        applyBannerContainerLayout(container, n);
        container.innerHTML = banners.map(b => {
          const title = b.title ? escHtml(b.title) : '';
          const subtitle = b.subtitle ? escHtml(b.subtitle) : '';
          const overlay = (title || subtitle)
            ? `<div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent flex flex-col justify-end p-4 sm:p-6 z-10 pointer-events-none">
                ${title ? `<p class="text-white text-lg sm:text-2xl font-bold leading-tight">${title}</p>` : ''}
                ${subtitle ? `<p class="text-white/90 text-xs sm:text-sm mt-1">${subtitle}</p>` : ''}
              </div>`
            : '';
          const altText = escHtml(b.title || 'Banner promocional');
          return `<a href="${escHtml(b.link_href || '/')}" class="${bannerItemClass(n)}">
            ${bannerMediaHtml(b, altText)}
            ${overlay}
          </a>`;
        }).join('');
      } catch (e) {
        section.classList.add('hidden');
      }
    }

    document.getElementById('btn-prev').addEventListener('click', () => {
      if (state.page > 1) { state.page -= 1; setUrl(state); loadProductos(); window.scrollTo({top:0,behavior:'smooth'}); }
    });
    document.getElementById('btn-next').addEventListener('click', () => {
      state.page += 1; setUrl(state); loadProductos(); window.scrollTo({top:0,behavior:'smooth'});
    });

    async function initCatalog() {
      loadHomeBanners();
      await syncFilterBars();
      loadProductos();
    }

    initCatalog();
  </script>

  <script src="/static/js/shoppingCart.js"></script>
</body>
</html>
