<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{ page_title_login }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/js/toast.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-900">{{ login_heading }}</h2>
    
    <form id="login-form" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700">{{ label_username }}</label>
        <input id="username" name="username" type="text" required
               class="mt-1 w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:border-gray-900">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">{{ label_password }}</label>
        <input id="password" name="password" type="password" required
               class="mt-1 w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:border-gray-900">
      </div>
      <button type="submit"
              class="w-full bg-black text-white py-2 rounded-md font-bold hover:bg-gray-900 transition">
        {{ btn_sign_in }}
      </button>
    </form>

    <p id="login-msg" class="mt-4 text-center text-sm text-gray-600"></p>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const loginMsg = document.getElementById("login-msg");
      loginMsg.textContent = "";

      try {
        const resp = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ username, password })
        });

        if (!resp.ok) {
          showToast("Credenciales inválidas", { type: "error" });
          return;
        }

        const data = await resp.json();
        localStorage.setItem("token", data.access_token);
        loginMsg.textContent = "Login exitoso ✔️";
        showToast("Login exitoso", { type: "success", duration: 1500 });

        window.location.href = "/admin-panel";
      } catch (err) {
        showToast("Error de conexión", { type: "error" });
      }
    });
  </script>

</body>
</html>
