<h3 class="text-base font-semibold text-gray-900 mb-1">{{ admin_colors_tab_heading }}</h3>
<p class="text-xs text-gray-600 mb-6">{{ admin_colors_tab_help }}</p>

<form id="catalog-color-form" class="space-y-4 mb-8 border-b border-gray-200 pb-8">
  <input type="hidden" id="catalog-color-id" value="">
  <div class="flex flex-col lg:flex-row flex-wrap gap-3 items-end">
    <div class="flex-1 min-w-[180px]">
      <label for="catalog-color-label" class="block text-xs font-medium text-gray-700">{{ admin_colors_new_label }}</label>
      <input id="catalog-color-label" type="text" autocomplete="off"
        placeholder="{{ admin_colors_new_placeholder }}"
        class="mt-1 w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:border-gray-900 text-sm">
    </div>
    <div>
      <label for="catalog-color-hex" class="block text-xs font-medium text-gray-700">{{ admin_colors_pick_label }}</label>
      <div class="mt-1 flex items-center gap-2">
        <span id="catalog-color-preview" class="w-10 h-10 rounded-full border border-gray-300 shrink-0" style="background:#2563EB" aria-hidden="true"></span>
        <input id="catalog-color-hex" type="color" value="#2563EB"
          class="h-10 w-14 cursor-pointer border border-gray-300 rounded-md p-0.5 bg-white"
          title="{{ admin_colors_pick_label }}">
      </div>
    </div>
    <button type="submit" id="catalog-color-submit"
      class="min-h-[42px] px-4 py-2 rounded-md bg-black text-white text-sm font-semibold hover:bg-gray-900">
      {{ admin_colors_btn_add }}
    </button>
    <button type="button" id="catalog-color-cancel" class="hidden min-h-[42px] px-4 py-2 rounded-md border border-gray-300 bg-white text-gray-900 text-sm font-semibold hover:bg-gray-50">
      {{ admin_colors_btn_cancel }}
    </button>
  </div>
  <div>
    <p class="text-xs font-medium text-gray-700 mb-2">{{ admin_colors_presets_label }}</p>
    <div id="catalog-color-presets" class="flex flex-wrap gap-2">
      <button type="button" class="catalog-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#000000" title="Negro" style="background:#000000"></button>
      <button type="button" class="catalog-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#FFFFFF" title="Blanco" style="background:#FFFFFF"></button>
      <button type="button" class="catalog-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#DC2626" title="Rojo" style="background:#DC2626"></button>
      <button type="button" class="catalog-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#2563EB" title="Azul" style="background:#2563EB"></button>
      <button type="button" class="catalog-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#38BDF8" title="Celeste" style="background:#38BDF8"></button>
      <button type="button" class="catalog-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#16A34A" title="Verde" style="background:#16A34A"></button>
      <button type="button" class="catalog-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#F59E0B" title="Amarillo" style="background:#F59E0B"></button>
      <button type="button" class="catalog-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#EC4899" title="Rosa" style="background:#EC4899"></button>
      <button type="button" class="catalog-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#78716C" title="Gris" style="background:#78716C"></button>
    </div>
  </div>
</form>

<p id="colors-catalog-status" class="text-sm text-gray-500 mb-4"></p>
<div class="overflow-x-auto rounded-lg border border-gray-200">
  <table class="min-w-full divide-y divide-gray-200 text-sm">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-3 py-2 text-left font-semibold text-gray-700">{{ admin_colors_col_swatch }}</th>
        <th class="px-3 py-2 text-left font-semibold text-gray-700">{{ admin_colors_col_name }}</th>
        <th class="px-3 py-2 text-left font-semibold text-gray-700">{{ admin_colors_col_hex }}</th>
        <th class="px-3 py-2 text-right font-semibold text-gray-700">{{ admin_colors_col_actions }}</th>
      </tr>
    </thead>
    <tbody id="colors-catalog-body" class="divide-y divide-gray-100 bg-white"></tbody>
  </table>
</div>
