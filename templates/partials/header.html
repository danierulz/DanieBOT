<!-- Navbar -->
<header class="sticky top-0 z-40 bg-black text-white shadow-md">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3 sm:py-4 flex items-center justify-between gap-2 min-h-[52px] sm:min-h-[56px]">
    <div class="flex items-center gap-4">
      <a href="/" class="text-xl sm:text-2xl font-extrabold text-white hover:text-gray-200 hover:underline truncate max-w-[55vw] sm:max-w-none">{{ brand_name }}</a>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="toggleCarrito()"
        type="button"
        class="relative inline-flex items-center justify-center min-h-[44px] min-w-[44px] sm:px-3 sm:py-2 px-2.5 py-2 rounded-full bg-white text-black font-semibold shadow hover:bg-gray-100 touch-manipulation">
        <span aria-hidden="true">🛒</span><span id="carrito-count" class="ml-1 sm:ml-2 tabular-nums">0</span>
      </button>
      <button id="btn-login" type="button"
        class="inline-flex items-center justify-center min-h-[44px] px-3 rounded-full bg-white text-black font-semibold shadow hover:bg-gray-100 touch-manipulation text-sm sm:text-base">
        {{ nav_login }}
      </button>
      <button id="btn-admin" type="button"
        class="hidden inline-flex items-center justify-center min-h-[44px] px-3 rounded-full bg-white text-black font-semibold shadow hover:bg-gray-100 touch-manipulation text-sm sm:text-base">
        {{ nav_admin }}
      </button>
    </div>
  </div>
</header>

<!-- Carrito lateral -->
<aside id="carrito-panel"
  class="fixed top-0 right-0 w-full sm:w-96 h-full bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
  <div class="p-4 border-b flex items-center justify-between">
    <h2 class="text-lg font-bold">{{ cart_title }}</h2>
    <button type="button" onclick="toggleCarrito()" class="text-gray-600" aria-label="Cerrar">✖</button>

  </div>
  <div id="carrito-items" class="p-4 flex-1 overflow-y-auto"></div>
  <div class="p-4 border-t">
    <div class="flex justify-between items-center mb-3">
      <span class="font-semibold">{{ cart_total_label }}</span>
      <span class="text-xl font-bold text-gray-900">$<span id="carrito-total">0</span></span>
    </div>
    <div class="space-y-2">
      <!--
            <input id="customer_name" type="text" placeholder="Tu nombre (opcional)"
        class="w-full px-3 py-2 border rounded" />
      <input id="customer_phone" type="tel" placeholder="Teléfono (ej. 54911...)"
        class="w-full px-3 py-2 border rounded" />
      <textarea id="order_note" rows="2" placeholder="Nota para el pedido (opcional)"
        class="w-full px-3 py-2 border rounded"></textarea>-->
      <button type="button" id="btn-confirmar" onclick="confirmarPedido()" class="w-full bg-green-600 text-white py-2 rounded-full 
        font-bold hover:bg-green-700 transition disabled">
        {{ cart_btn_whatsapp }}
      </button>
    </div>
  </div>
</aside>
<!-- Script de login/logout -->
<script>
  const NAV_LOGIN = {{ nav_login | tojson }};
  const NAV_LOGOUT = {{ nav_logout | tojson }};

  const btnLogin = document.getElementById("btn-login");
  const btnAdmin = document.getElementById("btn-admin");

    function checkAuth() {
    const token = localStorage.getItem("token");
    if (token) {
      btnAdmin.classList.remove("hidden");
      btnAdmin.onclick = () => {
        window.location.href = "/admin-panel";
      };

      btnLogin.textContent = NAV_LOGOUT;
      btnLogin.onclick = () => {
        localStorage.removeItem("token");
        checkAuth();
        window.location.href = "/";
      };
    } else {
      btnAdmin.classList.add("hidden");

      btnLogin.textContent = NAV_LOGIN;
      btnLogin.onclick = () => {
        window.location.href = "/login";
      };
    }
  }


  checkAuth();
</script>
