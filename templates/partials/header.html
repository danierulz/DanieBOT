<!-- Navbar -->
<header class="sticky top-0 z-40 bg-black text-white shadow-md">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 py-2 sm:py-3 flex items-center justify-between gap-2 min-h-[52px] sm:min-h-[56px]">
    <div class="flex items-center gap-3">
      <button id="btn-mobile-menu" type="button"
        class="lg:hidden inline-flex items-center justify-center min-h-[40px] min-w-[40px] rounded-full hover:bg-white/10 touch-manipulation"
        aria-label="Abrir menú" aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5"/>
        </svg>
      </button>
      <a href="/" class="text-lg sm:text-2xl font-extrabold text-white hover:text-gray-200 truncate max-w-[42vw] sm:max-w-none">{{ brand_name }}</a>
    </div>

    <!-- Buscador desktop -->
    <form action="/" method="get" class="hidden lg:flex flex-1 max-w-xl mx-4">
      <div class="relative w-full">
        <input type="search" name="q" value="{{ request.query_params.get('q', '') if request else '' }}"
          placeholder="{{ nav_search_placeholder }}" aria-label="{{ nav_search_aria }}"
          class="w-full pl-10 pr-3 py-2 rounded-full bg-white text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-white/40">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
          class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </form>

    <div class="flex items-center gap-2 sm:gap-3">
      <button id="btn-mobile-search" type="button"
        class="lg:hidden inline-flex items-center justify-center min-h-[40px] min-w-[40px] rounded-full hover:bg-white/10 touch-manipulation"
        aria-label="Buscar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </button>
      <button onclick="toggleCarrito()"
        type="button"
        class="relative inline-flex items-center justify-center min-h-[40px] sm:min-h-[44px] sm:min-w-[44px] sm:px-3 sm:py-2 px-2.5 py-2 rounded-full bg-white text-black font-semibold shadow hover:bg-gray-100 touch-manipulation">
        <span aria-hidden="true">🛒</span><span id="carrito-count" class="ml-1 sm:ml-2 tabular-nums">0</span>
      </button>
      <button id="btn-login" type="button"
        class="hidden sm:inline-flex items-center justify-center min-h-[40px] sm:min-h-[44px] px-3 rounded-full bg-white text-black font-semibold shadow hover:bg-gray-100 touch-manipulation text-sm sm:text-base">
        {{ nav_login }}
      </button>
      <button id="btn-admin" type="button"
        class="hidden sm:inline-flex items-center justify-center min-h-[40px] sm:min-h-[44px] px-3 rounded-full bg-white text-black font-semibold shadow hover:bg-gray-100 touch-manipulation text-sm sm:text-base">
        {{ nav_admin }}
      </button>
    </div>
  </div>

  <!-- Buscador mobile colapsable -->
  <div id="mobile-search" class="lg:hidden hidden border-t border-white/10 bg-black px-3 py-2">
    <form action="/" method="get" class="flex">
      <div class="relative w-full">
        <input type="search" name="q" value="{{ request.query_params.get('q', '') if request else '' }}"
          placeholder="{{ nav_search_placeholder }}" aria-label="{{ nav_search_aria }}"
          class="w-full pl-10 pr-3 py-2 rounded-full bg-white text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-white/40">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
          class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </form>
  </div>

  <!-- Menú principal -->
  <nav id="main-nav" class="hidden lg:block border-t border-white/10 bg-black">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 flex flex-wrap items-center gap-1 sm:gap-2 py-1.5 text-sm">
      {% for link in nav_links %}
        <a href="{{ link.href }}"
          class="inline-flex items-center px-3 py-2 rounded-full hover:bg-white/10 {% if link.highlight %}text-red-400 font-bold hover:text-red-300{% else %}text-gray-200{% endif %}">
          {{ link.label }}
        </a>
      {% endfor %}
    </div>
  </nav>

  <!-- Menú mobile colapsable -->
  <div id="mobile-nav" class="lg:hidden hidden border-t border-white/10 bg-black">
    <div class="px-2 py-2 grid grid-cols-1 gap-1">
      {% for link in nav_links %}
        <a href="{{ link.href }}"
          class="block px-3 py-3 rounded-lg text-base hover:bg-white/10 {% if link.highlight %}text-red-400 font-bold{% else %}text-gray-100{% endif %}">
          {{ link.label }}
        </a>
      {% endfor %}
      <div class="border-t border-white/10 mt-1 pt-2 grid grid-cols-2 gap-2 px-2">
        <button id="btn-login-mobile" type="button"
          class="inline-flex items-center justify-center min-h-[44px] px-3 rounded-full bg-white text-black font-semibold shadow text-sm">
          {{ nav_login }}
        </button>
        <button id="btn-admin-mobile" type="button"
          class="hidden inline-flex items-center justify-center min-h-[44px] px-3 rounded-full bg-white text-black font-semibold shadow text-sm">
          {{ nav_admin }}
        </button>
      </div>
    </div>
  </div>
</header>

<!-- Carrito lateral -->
<aside id="carrito-panel"
  class="fixed top-0 right-0 w-full sm:w-96 h-full bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
  <div class="p-4 border-b flex items-center justify-between">
    <h2 class="text-lg font-bold">{{ cart_title }}</h2>
    <button type="button" onclick="toggleCarrito()" class="text-gray-600" aria-label="Cerrar">✖</button>
  </div>
  <div id="carrito-items" class="p-4 flex-1 overflow-y-auto"></div>
  <div class="p-4 border-t space-y-3">
    <div id="carrito-savings" class="hidden flex justify-between text-sm text-green-700 font-semibold">
      <span>{{ cart_savings }}</span>
      <span>$<span id="carrito-savings-amount">0</span></span>
    </div>
    <div class="flex justify-between items-center">
      <span class="font-semibold">{{ cart_total_label }}</span>
      <span class="text-xl font-bold text-gray-900">$<span id="carrito-total">0</span></span>
    </div>
    <button type="button" id="btn-confirmar" onclick="confirmarPedido()" class="w-full bg-green-600 text-white py-3 rounded-full font-bold hover:bg-green-700 transition min-h-[48px]">
      {{ cart_btn_whatsapp }}
    </button>
  </div>
</aside>

<script>
  const NAV_LOGIN = {{ nav_login | tojson }};
  const NAV_LOGOUT = {{ nav_logout | tojson }};

  const btnLogin = document.getElementById("btn-login");
  const btnAdmin = document.getElementById("btn-admin");
  const btnLoginMobile = document.getElementById("btn-login-mobile");
  const btnAdminMobile = document.getElementById("btn-admin-mobile");

  function checkAuth() {
    const token = localStorage.getItem("token");
    if (token) {
      btnAdmin && btnAdmin.classList.remove("hidden");
      btnAdminMobile && btnAdminMobile.classList.remove("hidden");
      const goAdmin = () => { window.location.href = "/admin-panel"; };
      if (btnAdmin) btnAdmin.onclick = goAdmin;
      if (btnAdminMobile) btnAdminMobile.onclick = goAdmin;

      const doLogout = () => {
        localStorage.removeItem("token");
        checkAuth();
        window.location.href = "/";
      };
      if (btnLogin) { btnLogin.textContent = NAV_LOGOUT; btnLogin.onclick = doLogout; }
      if (btnLoginMobile) { btnLoginMobile.textContent = NAV_LOGOUT; btnLoginMobile.onclick = doLogout; }
    } else {
      btnAdmin && btnAdmin.classList.add("hidden");
      btnAdminMobile && btnAdminMobile.classList.add("hidden");
      const goLogin = () => { window.location.href = "/login"; };
      if (btnLogin) { btnLogin.textContent = NAV_LOGIN; btnLogin.onclick = goLogin; }
      if (btnLoginMobile) { btnLoginMobile.textContent = NAV_LOGIN; btnLoginMobile.onclick = goLogin; }
    }
  }
  checkAuth();

  // Toggles mobile
  document.getElementById('btn-mobile-menu')?.addEventListener('click', () => {
    const el = document.getElementById('mobile-nav');
    if (!el) return;
    el.classList.toggle('hidden');
  });
  document.getElementById('btn-mobile-search')?.addEventListener('click', () => {
    const el = document.getElementById('mobile-search');
    if (!el) return;
    el.classList.toggle('hidden');
    if (!el.classList.contains('hidden')) {
      el.querySelector('input[name="q"]')?.focus();
    }
  });
</script>
