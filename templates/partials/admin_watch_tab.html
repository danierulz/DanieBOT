<!-- Pestaña local: primera página del listado. No importa el catálogo. -->
<div id="panel-watch" class="hidden bg-white shadow-lg rounded-lg p-6 md:p-8"
  data-notice="{{ admin_watch_notice }}"
  data-scanning="{{ admin_watch_scanning }}"
  data-empty="{{ admin_watch_empty }}"
  data-import-confirm="{{ admin_watch_import_confirm }}"
  data-copied="{{ admin_watch_copied }}"
  data-col-provider="{{ admin_watch_col_provider }}"
  data-col-title="{{ admin_watch_col_title }}"
  data-col-price="{{ admin_watch_col_price }}"
  data-col-status="{{ admin_watch_col_status }}">
  <h2 class="text-lg font-semibold text-gray-900 mb-1">{{ admin_watch_heading }}</h2>
  <p class="text-sm font-medium text-gray-900 mb-2">{{ admin_watch_notice }}</p>
  <p class="text-sm text-gray-600 mb-4">{{ admin_watch_help }}</p>
  <p class="text-xs text-gray-500 mb-4">{{ admin_watch_laslocas_login }}</p>

  <div class="flex flex-col gap-4 mb-4">
    <fieldset>
      <legend class="text-sm font-medium text-gray-700 mb-2">{{ admin_watch_providers_label }}</legend>
      <div class="flex flex-wrap gap-4 text-sm text-gray-800">
        <label class="inline-flex items-center gap-2">
          <input type="checkbox" class="watch-provider w-4 h-4 accent-black" value="laslocas" checked>
          Las Locas
        </label>
        <label class="inline-flex items-center gap-2">
          <input type="checkbox" class="watch-provider w-4 h-4 accent-black" value="nissie" checked>
          Nissie
        </label>
        <label class="inline-flex items-center gap-2">
          <input type="checkbox" class="watch-provider w-4 h-4 accent-black" value="sochic" checked>
          So Chic
        </label>
        <label class="inline-flex items-center gap-2">
          <input type="checkbox" id="watch-provider-holic" class="watch-provider w-4 h-4 accent-black" value="holic">
          {{ admin_watch_holic }}
        </label>
      </div>
    </fieldset>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="watch-limit" class="block text-sm font-medium text-gray-700">{{ admin_watch_limit_label }}</label>
        <select id="watch-limit" class="mt-1 w-full px-3 py-2 border rounded-md bg-white text-sm">
          <option value="5" selected>5</option>
          <option value="10">10</option>
        </select>
      </div>
      <div>
        <label for="watch-laslocas-category" class="block text-sm font-medium text-gray-700">{{ admin_watch_laslocas_category }}</label>
        <select id="watch-laslocas-category" class="mt-1 w-full px-3 py-2 border rounded-md bg-white text-sm">
          {% for cat in laslocas_bulk_categories %}
          <option value="{{ cat.id }}" {% if cat.id == 'denim' %}selected{% endif %}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="flex flex-wrap gap-3">
      <button type="button" id="watch-scan-btn"
        class="px-4 py-2 rounded-md bg-black text-white font-bold hover:bg-gray-900">
        {{ admin_watch_btn }}
      </button>
      <button type="button" id="watch-copy-btn"
        class="px-4 py-2 rounded-md border border-gray-300 bg-white text-gray-900 font-semibold hover:bg-gray-50">
        {{ admin_watch_copy_btn }}
      </button>
      <button type="button" id="watch-import-btn"
        class="px-4 py-2 rounded-md border border-gray-300 bg-white text-gray-900 font-semibold hover:bg-gray-50">
        {{ admin_watch_import_btn }}
      </button>
    </div>
  </div>

  <p id="watch-status" class="text-sm text-gray-700 min-h-[1.25rem] mb-3"></p>
  <div id="watch-errors" class="mb-3 space-y-1 text-sm text-red-800"></div>

  <div class="overflow-x-auto rounded-md border border-gray-200">
    <table class="min-w-full text-sm">
      <thead class="bg-gray-100 text-left">
        <tr>
          <th class="px-2 py-2 w-10">
            <input type="checkbox" id="watch-select-new" class="w-4 h-4 accent-black" title="{{ admin_watch_select_new }}" aria-label="{{ admin_watch_select_new }}">
          </th>
          <th class="px-2 py-2 font-semibold text-gray-700">{{ admin_watch_col_provider }}</th>
          <th class="px-2 py-2 font-semibold text-gray-700">{{ admin_watch_col_title }}</th>
          <th class="px-2 py-2 font-semibold text-gray-700">{{ admin_watch_col_price }}</th>
          <th class="px-2 py-2 font-semibold text-gray-700">{{ admin_watch_col_status }}</th>
        </tr>
      </thead>
      <tbody id="watch-table-body"></tbody>
    </table>
  </div>

  <div class="mt-4">
    <h3 class="text-sm font-semibold text-gray-900 mb-1">{{ admin_watch_cli_heading }}</h3>
    <pre id="watch-cli" class="text-xs bg-gray-50 border border-gray-200 rounded-md p-3 overflow-x-auto whitespace-pre-wrap"></pre>
  </div>
</div>
