<div class="border border-gray-200 rounded-lg p-4 bg-gray-50" id="product-colors-section">
  <h3 class="text-sm font-semibold text-gray-900 mb-1">{{ admin_colors_heading }}</h3>
  <p class="text-xs text-gray-600 mb-3">{{ admin_colors_help }}</p>
  <div id="product-colors-picker" class="mb-3">
    <p id="product-colors-status" class="text-xs text-gray-500">{{ admin_colors_loading }}</p>
  </div>
  <div class="flex flex-col gap-3">
    <div class="flex flex-col sm:flex-row flex-wrap gap-2 items-end">
      <div class="flex-1 min-w-[180px]">
        <label for="new-color-label" class="block text-xs font-medium text-gray-700">{{ admin_colors_new_label }}</label>
        <input id="new-color-label" type="text" autocomplete="off"
          placeholder="{{ admin_colors_new_placeholder }}"
          class="mt-1 w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:border-gray-900 text-sm">
      </div>
      <div class="flex items-end gap-2">
        <div>
          <label for="new-color-hex" class="block text-xs font-medium text-gray-700">{{ admin_colors_pick_label }}</label>
          <div class="mt-1 flex items-center gap-2">
            <span id="new-color-preview" class="w-10 h-10 rounded-full border border-gray-300 shrink-0" style="background:#2563EB" aria-hidden="true"></span>
            <input id="new-color-hex" type="color" value="#2563EB"
              class="h-10 w-14 cursor-pointer border border-gray-300 rounded-md p-0.5 bg-white"
              title="{{ admin_colors_pick_label }}">
          </div>
        </div>
        <button type="button" id="btn-add-color"
          class="min-h-[42px] px-4 py-2 rounded-md border border-gray-300 bg-white text-gray-900 text-sm font-semibold hover:bg-gray-50">
          {{ admin_colors_btn_add }}
        </button>
      </div>
    </div>
    <div>
      <p class="text-xs font-medium text-gray-700 mb-2">{{ admin_colors_presets_label }}</p>
      <div id="color-presets" class="flex flex-wrap gap-2">
        <button type="button" class="color-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#000000" title="Negro" style="background:#000000"></button>
        <button type="button" class="color-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#FFFFFF" title="Blanco" style="background:#FFFFFF"></button>
        <button type="button" class="color-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#DC2626" title="Rojo" style="background:#DC2626"></button>
        <button type="button" class="color-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#2563EB" title="Azul" style="background:#2563EB"></button>
        <button type="button" class="color-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#38BDF8" title="Celeste" style="background:#38BDF8"></button>
        <button type="button" class="color-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#16A34A" title="Verde" style="background:#16A34A"></button>
        <button type="button" class="color-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#F59E0B" title="Amarillo" style="background:#F59E0B"></button>
        <button type="button" class="color-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#EC4899" title="Rosa" style="background:#EC4899"></button>
        <button type="button" class="color-preset-btn w-8 h-8 rounded-full border-2 border-gray-300 hover:border-gray-900 focus:outline-none focus:ring-2 focus:ring-black/30" data-hex="#78716C" title="Gris" style="background:#78716C"></button>
      </div>
    </div>
  </div>
</div>
