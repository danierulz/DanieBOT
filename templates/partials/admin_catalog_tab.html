<div id="panel-catalog" class="hidden bg-white shadow-lg rounded-lg p-6 md:p-8">
  <h2 class="text-lg font-semibold text-gray-900 mb-1">{{ admin_catalog_tab_heading }}</h2>
  <p class="text-xs text-gray-600 mb-6">{{ admin_catalog_tab_help }}</p>

  <nav class="flex flex-wrap gap-2 mb-6 border-b border-gray-200" aria-label="{{ admin_catalog_tab_heading }}">
    <button type="button" id="catalog-sub-categorias"
      class="catalog-sub-btn px-4 py-2 font-semibold border-b-2 border-black text-gray-900">
      {{ admin_catalog_sub_categories }}
    </button>
    <button type="button" id="catalog-sub-talles"
      class="catalog-sub-btn px-4 py-2 font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-800">
      {{ admin_catalog_sub_sizes }}
    </button>
    <button type="button" id="catalog-sub-colores"
      class="catalog-sub-btn px-4 py-2 font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-800">
      {{ admin_catalog_sub_colors }}
    </button>
  </nav>

  <div id="catalog-section-categorias">
    {% include "partials/admin_catalog_categories_section.html" %}
  </div>
  <div id="catalog-section-talles" class="hidden">
    {% include "partials/admin_catalog_sizes_section.html" %}
  </div>
  <div id="catalog-section-colores" class="hidden">
    {% include "partials/admin_catalog_colors_section.html" %}
  </div>
</div>
